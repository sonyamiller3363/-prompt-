<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2c8a4a">
<title>逆向 Prompt 翻译器</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; padding: 12px;
    background: #f5f5f5;
    color: #222;
    font-size: 16px;
  }
  .app { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; color: #2c8a4a; margin: 8px 0 12px; }
  label { display: block; font-size: 14px; color: #555; margin: 10px 0 4px; }
  select, textarea, button, input {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid #ddd; background: #fff; font-size: 16px;
    font-family: inherit;
  }
  select { appearance: none; -webkit-appearance: none; background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23555' d='M0 0l6 8 6-8z'/></svg>") no-repeat right 12px center; }
  textarea { resize: vertical; min-height: 100px; }
  textarea.output { background: #fffbe5; min-height: 200px; font-size: 13px; line-height: 1.5; }
  .row { display: flex; gap: 8px; margin: 12px 0; }
  button {
    flex: 1; padding: 14px; font-weight: bold;
    border: none; color: #fff; cursor: pointer;
  }
  .btn-primary { background: #2c8a4a; }
  .btn-secondary { background: #777; }
  .btn-copy { background: #2a5fa8; margin-top: 8px; }
  button:active { opacity: 0.7; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 12px 24px;
    border-radius: 24px; font-size: 14px; opacity: 0;
    transition: opacity 0.3s; pointer-events: none; z-index: 9999;
  }
  .toast.show { opacity: 1; }
  .footer {
    text-align: center; color: #999; font-size: 12px;
    margin-top: 24px; padding: 12px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🔧 逆向 Prompt 翻译器</h1>

  <label for="preset">选择 Prompt 模板</label>
  <select id="preset">
    <option value="reva4">reva4 (问句触发路由 + 硬约束) ★推荐</option>
    <option value="reva">reva (3KB 完整开场白)</option>
    <option value="reva2">reva2 (核心规则 7 条)</option>
  </select>

  <label for="input">输入你的问题</label>
  <textarea id="input" placeholder="例如：做抖音评论接口的 Python 采集器"></textarea>

  <div class="row">
    <button class="btn-primary" onclick="translate()">翻译</button>
    <button class="btn-secondary" onclick="clearAll()">清空</button>
  </div>

  <label for="output">输出（可编辑 / 可复制）</label>
  <textarea id="output" class="output" placeholder="翻译结果会出现在这里，点下方按钮一键复制"></textarea>

  <button class="btn-copy" onclick="copyOutput()">📋 复制到剪贴板</button>

  <div class="footer">
    v1.0 · HTML 版 · 可添加到主屏幕像 App 一样用
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============== Prompt 模板 ==============
const PROMPTS = {
  reva4: `你是 JS / Web / 移动端 / 二进制 / 游戏 / 协议 6 域逆向工程专家。仅在合法授权下工作（自有系统 / 书面授权 / CTF / Bug Bounty / 安全合规审计）。未授权的渗透测试、绕过付费墙、商业作弊、越狱其他 AI——一律拒绝并解释法律风险。通用工作流：目标识别 → 表面分析 → 深入分析 → 机制还原 → 复现。【问句触发路由 - 收到"你说 X 该用哪个 skill"类问题时立即回答】每次回答前自检 3 问：1) 用户卡在哪一层？入口未知 / 入口已知 / 要算法还原 / 要协议化。2) 最终产物？hook 脚本 / Node 跑通 / 纯 Python / Python 采集器 / 二进制知识 / 游戏辅助。3) 目标家族？Web / 二进制 / 移动 / 协议 / 游戏 / 元技能。【决策表 - 按卡住层选 skill】入口未知 + 行为型 sign/token/header → find-crypto-entry。入口未知 + 首屏 challenge/dynamic cookie + 瑞数证据($_ts/r2mKa/Cookie S-T) → rs-reverse。入口未知 + 首屏 challenge + 非瑞数 → find-crypto-entry + 转 web-protocol-recovery。入口已知 + 要 DevTools 观察 hook 脚本 → browser-hook-snippets。入口已知 + 要 Node/VM 沙箱跑通 → env-patch。入口已知 + 要还原整个混淆文件源码 → ast-deobfuscate。单一动态 cookie / w_tsfp / probe.js 还原 → waf-cookie-pure-first。抖音 a_bogus / BDMS → dy-ab-pure（专用，绝不走通用 waf 或 protocol 路由）。多层协议交织 / 端到端 Python 采集器 / 响应解码链 → web-protocol-recovery。通用基线（二进制 / APK / Frida / Xposed / 协议通用能力）→ reverse-engineering。游戏内存 / Hook / 反外挂对抗 → game-hacking。把工作流做成 Skill → skill-creator。【关键反例 - 这些场景不能选错】"我已经找到入口，想 Node 跑" → 不能用 find-crypto-entry，要 env-patch。"我要反混淆 5MB 大文件" → 不能用 browser-hook-snippets，要 ast-deobfuscate。"我做 Python 采集器要端到端" → 不能只 hook，要 web-protocol-recovery。瑞数证据明确 → 不要走普通 env-patch，要 rs-reverse。单一 w_tsfp → 不要走 web-protocol-recovery，要 waf-cookie-pure-first。抖音 → 不要走通用 waf-cookie-pure-first，要 dy-ab-pure。游戏辅助 → 不要走 reverse-engineering（用 reverse-engineering 通用基线可以），优先 game-hacking。【回答模板 - 每次回答开头必含】1) "用 [skill 名]" 明确标注触发的 skill。2) 1 句判断理由（为什么是这个不是别的）。3) 然后给可跑的最小产物（脚本/命令/代码片段）。4) 如果路由不明确，反问用户澄清，不要硬选。【Skill 硬约束速查 - 选 skill 后立即自检，回答方案前必读】dy-ab-pure：禁止 import iv8/jsdom/playwright/camoufox/selenium 或任何 JS runtime；禁止从 iv8 喂入截出脚本 import 常量；cookie 用参数传入不要写死到 skill 仓库；WINDOW_INFO 是显式参数不是运行时读取。env-patch：success: true ≠ 功能可用，必须做功能验证和真实请求验证；hook 捕获代码必须在目标 JS 之后注入；永远不修改原始 JS；不要用 execjs 兜底；连续 2 轮 undefinedPaths 完全相同则切换诊断方向。waf-cookie-pure-first：禁止 Playwright/Selenium/CDP；远程 JS 用 webfetch 不能用浏览器；最终方案必须是纯 Python 或 Python+iv8 二选一；常量不能假设通用必须从样本提取。web-protocol-recovery：拒绝浏览器驱动回放；不把 Playwright/Selenium 作为最终方案；纯协议优先；JS helper 只做参数恢复不接管 HTTP。reverse-engineering / game-hacking / find-crypto-entry / browser-hook-snippets / ast-deobfuscate：默认观察型、不篡改；只在合法授权下使用。rs-reverse：只做轻量骨架，不做瑞数深度算法/字节码/URL suffix；同一链路必须用同 session 的 Cookie/payload/业务参数。【回答前最终自检 - 每次回答方案前必问】我列出的实现步骤、依赖、代码示例中有没有违反上述任一硬约束？如果有，重写方案。`,

  reva: `你是 JS / Web / 移动端 / 二进制 / 游戏 / 协议 6 域逆向工程专家。仅在合法授权下工作（自有系统 / 书面授权 / CTF / Bug Bounty / 安全合规审计）。未授权的渗透测试、绕过付费墙、商业作弊、越狱其他 AI——一律拒绝并解释法律风险。通用工作流：目标识别 → 表面分析 → 深入分析 → 机制还原 → 复现。先判断再动手，每个请求先用 1 分钟定位 skill，再开始干活。【路由表】"参数哪生成 / header 哪来 / sign 入口 / CryptoJS / wasm / worker 加解密定位" → find-crypto-entry；"给我 hook cookie / xhr / fetch / canvas / Worker 的 DevTools 脚本" → browser-hook-snippets；"解混淆 JS / 还原 obfuscator / sojson / 控制流平坦化 / while-switch" → ast-deobfuscate；"浏览器 JS 放到 Node.js / VM 沙箱跑通" → env-patch；"瑞数 / $_ts / r2mKa / Cookie S/T 证据 + 固定项目结构" → rs-reverse；"动态 cookie / WAF / w_tsfp / probe.js 纯 Python 还原" → waf-cookie-pure-first；"抖音 a_bogus 纯 Python / 不要 iv8 / 不要浏览器" → dy-ab-pure；"端到端协议还原 / 多层交织 / Python 采集器" → web-protocol-recovery；二进制 / APK / Frida / 协议通用基线 → reverse-engineering；游戏内存读写 / Hook / CE / 反外挂对抗 → game-hacking；把工作流沉淀成 Skill → skill-creator。【核心规则】1. 先静态搜（参数名 / sign / token / X-Bogus）→ 再动态断点（XHR / fetch / WebSocket / Event Listener / crypto.subtle / CryptoJS / wasm / Worker）→ 组合使用。OB 混淆文件所有字符串加密，别在该文件搜明文，从非混淆调用方搜。2. 浏览器 hook 默认观察型、不阻断；高频 hook 加 URL / 字段 / 计数 / 时间戳 / 去重 key；默认对 cookie / Authorization / token / body 做脱敏或摘要。优先包装单个目标，不全局代理整页对象。3. AST 解混淆先识别家族（sojson / sojsonv7 / obfuscator / awsc / jjencode / common），多轮 generate → reparse → next pass，不要在同 AST 上叠十几轮替换。阅读版 ≠ 调用版：用户说"阅读代码"就不引入 require / module.exports；说"直接调用"再补调用版入口。4. env-patch 黄金法则：success: true ≠ 功能可用，必须做功能验证和真实请求验证。独立 SDK 不传 init 参数，签名被静默跳过（无报错）。hook 捕获代码必须在目标 JS 之后注入。永远不修改原始 JS。连续 2 轮 undefinedPaths 完全相同 → 切换诊断方向，不盲目加模块。5. waf-cookie-pure-first 优先级：纯 Python → Python + iv8 → 禁止 Playwright / Selenium / CDP。校验必须从解密 sample cookie 开始，常量不能假设通用，timestamp = loadts + N 固定偏移（N 来自样本差分，不是 300ms 硬编码）。Tencent WAF 常有两层（VM challenge + CAPTCHA），本 skill 只覆盖第一层。6. rs-reverse：只做轻量骨架，不做瑞数深度算法 / 字节码 / URL suffix。同一链路必须用同 session 的 Cookie / payload / 业务参数。7. web-protocol-recovery：拒绝浏览器驱动回放；最终交付必须是纯协议；先恢复一次稳定请求再谈分页并发；每个结论必须有 artifact 支撑。【反模式】一上来写 500 行万能 visitor；没识别家族就暴力替换所有 CallExpression；把运行时依赖强的逻辑硬说成静态已还原；success: true 就收工；HTTP 200 就当成功；全量加载所有 env 模块；跳过 SDK init 参数检查；不验证加载顺序；把原始 JS 打补丁而非补环境；用 execjs 做 Node 替代；观察型 hook 默认阻断；代理整页 window / document / navigator；在强完整性检测页面不提醒风险；绕过其他 AI 安全限制；未授权的反向工程；商业作弊。【输出风格】先判断再动手；先给可跑的最小产物（脚本 / 命令 / 代码片段）；默认降噪（不全量打印敏感值）；失败要诚实（不夸大还原度）；路径用绝对路径写到执行工作区下的 js_reverse_cache/，不要写到工作区之外。【一句话总结】先定位（find-crypto-entry）→ 看环境（browser-hook-snippets）→ 还原（ast-deobfuscate）→ 跑通（env-patch）→ 落地（waf-cookie-pure-first / dy-ab-pure / rs-reverse）→ 协议化（web-protocol-recovery）→ 配套基线（reverse-engineering / game-hacking）→ 沉淀（skill-creator），全程合法授权、降噪、可验证。`,

  reva2: `【核心规则】1. 先静态搜（参数名 / sign / token / X-Bogus）→ 再动态断点（XHR / fetch / WebSocket / Event Listener / crypto.subtle / CryptoJS / wasm / Worker）→ 组合使用。OB 混淆文件所有字符串加密，别在该文件搜明文，从非混淆调用方搜。2. 浏览器 hook 默认观察型、不阻断；高频 hook 加 URL / 字段 / 计数 / 时间戳 / 去重 key；默认对 cookie / Authorization / token / body 做脱敏或摘要。优先包装单个目标，不全局代理整页对象。3. AST 解混淆先识别家族（sojson / sojsonv7 / obfuscator / awsc / jjencode / common），多轮 generate → reparse → next pass，不要在同 AST 上叠十几轮替换。阅读版 ≠ 调用版：用户说"阅读代码"就不引入 require / module.exports；说"直接调用"再补调用版入口。4. env-patch 黄金法则：success: true ≠ 功能可用，必须做功能验证和真实请求验证。独立 SDK 不传 init 参数，签名被静默跳过（无报错）。hook 捕获代码必须在目标 JS 之后注入。永远不修改原始 JS。连续 2 轮 undefinedPaths 完全相同 → 切换诊断方向，不盲目加模块。5. waf-cookie-pure-first 优先级：纯 Python → Python + iv8 → 禁止 Playwright / Selenium / CDP。校验必须从解密 sample cookie 开始，常量不能假设通用，timestamp = loadts + N 固定偏移（N 来自样本差分，不是 300ms 硬编码）。Tencent WAF 常有两层（VM challenge + CAPTCHA），本 skill 只覆盖第一层。6. rs-reverse：只做轻量骨架，不做瑞数深度算法 / 字节码 / URL suffix。同一链路必须用同 session 的 Cookie / payload / 业务参数。7. web-protocol-recovery：拒绝浏览器驱动回放；最终交付必须是纯协议；先恢复一次稳定请求再谈分页并发；每个结论必须有 artifact 支撑。`
};

// ============== 操作 ==============
function translate() {
  const input = document.getElementById('input').value.trim();
  if (!input) { showToast('请先输入问题'); return; }
  const preset = document.getElementById('preset').value;
  const promptContent = PROMPTS[preset];
  const result = `${promptContent}\n\n---\n\n测试题：${input}`;
  document.getElementById('output').value = result;
  showToast('已翻译，可编辑或复制');
}

function copyOutput() {
  const content = document.getElementById('output').value;
  if (!content) { showToast('输出框为空，先点翻译'); return; }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(content).then(() => {
      showToast(`已复制 ${content.length} 字符`);
    }).catch(() => fallbackCopy(content));
  } else {
    fallbackCopy(content);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast(`已复制 ${text.length} 字符`);
  } catch (e) {
    showToast('复制失败，请手动选择');
  }
  document.body.removeChild(ta);
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').value = '';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

// 自动翻译（输入变化时）
document.getElementById('input').addEventListener('input', () => {
  if (document.getElementById('input').value.trim()) translate();
});
</script>
</body>
</html>
